[package]
name = "bitchord-desktop"
version = "1.9.5"
description = "BitChord — an aesthetic YouTube Music client, now native on the desktop"
edition = "2021"
license = "GPL-3.0"
rust-version = "1.77.2"
default-run = "bitchord-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
souvlaki = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
log = "0.4"
bitchord-core = { path = "core" }

# The Dynamic Island's resize is one atomic SetWindowPos — sizing and centring
# in the same WM_WINDOWPOSCHANGED — because a plain set_size anchors the
# top-left corner on Windows and the pill read the move home as a two-step
# jump (the "centre-left, then centre" morph). Same 0.62 the Tauri/tao tree
# already pins in Cargo.lock, so this adds features, not a second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# The same story on macOS, where tao's set_size (setContentSize:, bottom-left
# anchored) and set_position (setFrameOrigin:) are two async main-thread
# dispatches — two presented frames, the same "centre-left, then centre"
# morph. The island moves and resizes in one NSWindow setFrame:display:
# instead. objc2 is already in Cargo.lock (tao/wry pull it); pinned to the
# same versions, this adds no second copy.
#
# objc2-app-kit is chrome.rs's traffic lights: the standard window buttons,
# hidden for as long as the full-screen player is open. Same 0.3.2 the lock
# already pins (wry pulls it, with the NSWindow/NSView/NSButton features
# already enabled), so this adds no second copy either.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSButton",
    "NSResponder",
    "NSWindow",
    "NSView",
    "NSControl",
    "objc2-core-foundation",
] }

# And on Linux: gdk_window_move_resize carries position and size in one
# request (one X11 ConfigureWindow), where gtk's move + resize are two
# server round-trips the WM can paint between. gtk 0.18 is what tauri
# already pins in Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[workspace]
members = ["core"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
